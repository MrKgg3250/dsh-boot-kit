name: release

# 发布走 tag，不依赖本机装没装 npm：
#   - 没有 NPM_TOKEN 也能跑：产物以 tarball 附件挂在 GitHub Release 上，
#     `dsh plugin add <tarball-url>` 直接可用 —— dsh-startup-screen 就是这么发的。
#   - 在仓库 secret 里加了 NPM_TOKEN 之后，同一条流水线会顺带发 npm，
#     本机什么都不用装。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'already-pushed tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接进 step 的 if；先落到 env 再比。布尔值，不含令牌本身。
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发时是 refs/tags/v*，手动触发时是输入的 tag
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: tests
        run: |
          node --test "packages/dsh-skin-boot-sync/test/*.test.mjs"
          node --test "packages/dsh-boot-kit/test/*.test.mjs"

      - name: versions
        id: v
        run: |
          echo "plugin=$(node -p "require('./packages/dsh-skin-boot-sync/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "cli=$(node -p "require('./packages/dsh-boot-kit/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: pack
        run: |
          mkdir -p dist
          (cd packages/dsh-skin-boot-sync && npm pack --pack-destination ../../dist)
          (cd packages/dsh-boot-kit       && npm pack --pack-destination ../../dist)

      # 顺序不能反：CLI 在目标 profile 里按包名安装插件，插件必须先存在。
      # 没有令牌时整步跳过，下面的 Release 照常产出。
      - name: publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (cd packages/dsh-skin-boot-sync && npm publish --access public)
          (cd packages/dsh-boot-kit       && npm publish --access public)

      - name: github release (works without any npm account)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Delete + recreate rather than upload into an existing release:
          # deleting the tag that a release points at turns that release into a
          # DRAFT, and draft assets 404 for everyone without write access. A
          # re-published tag must therefore never leave the old object behind.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/*.tgz \
            --title "$TAG · plugin v${{ steps.v.outputs.plugin }} · cli v${{ steps.v.outputs.cli }}" \
            --generate-notes
